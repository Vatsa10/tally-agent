# The demo script. This file is the source of truth for the video.
#
# The shape of it: every claim the agent makes in the terminal is then checked
# on Tally's own screen. The agent saying the stock is down by two is a claim;
# Tally's Stock Summary saying it is evidence, and it costs one keystroke. A
# demo that only ever shows its own UI is asking to be taken on trust.
#
# The arc follows the work a practice actually has: one voucher to show how a
# write is made and approved, then the pile of bills that is the real volume,
# then the agent working inside Tally where a bookkeeper can watch it, then the
# month-end close that is the reason any of it is worth buying.
#
# Copy is written the way the codebase talks: declarative, no adjectives doing
# sales work. Numbers are spelled the way a voice should read them, and
# abbreviations phonetically where a TTS engine would otherwise guess - "G-S-T-R
# two B", "X M L". The narration is checked against the rendered audio, so a
# mispronunciation fails the build rather than reaching the video.
title: tallyagent

voice:
  # Pinned here, not in code. `make_demo.py voices --locale en-IN` lists the
  # alternatives with their supported styles.
  voice_id: en-IN-eashwar
  style: Narration
  rate: -4

asr_model: nova-3
company: TA-Demo Traders

chapters:
  - id: ch1-problem
    title: The problem
    beats:
      - id: b01-title
        action: title_card
        say: >-
          TallyPrime runs the books at most Indian accounting firms. It has a
          full X M L interface, and almost nobody uses it. The work is done by
          hand, screen by screen, voucher by voucher.
        tail_pad: 0.8

      - id: b02-tally
        action: show_tally
        say: >-
          This is a real TallyPrime instance with a real company loaded.
          Everything after this point is live, and everything the agent claims
          gets checked against this window.

  - id: ch2-draft
    title: Chat drafts a voucher
    beats:
      - id: b03-tui
        action: open_tui
        say: >-
          The agent runs beside it. The status line states the scope it is
          allowed to write in: companies named T-A, and nothing else.

      - id: b04-ask
        action: say_to_agent
        args:
          # Named precisely. The agent refuses to guess a party or a tax rate,
          # which is what the refusal chapter is about - asking it vaguely here
          # would only show the same refusal twice.
          text: >-
            raise a sales invoice to Acme Industries for 2 Widget at 3200 each,
            18% GST, sales ledger Sales - GST 18%, dated 2 June 2026,
            reference DEMO-{run}
        say: A sale, in plain words.
        tail_pad: 0.6

      - id: b05-draft
        action: show_draft
        say: >-
          The model does not write the voucher. It calls a typed tool, and the
          tool builds it. Two widgets at thirty two hundred, taxable value six
          thousand four hundred, and integrated G S T rather than the split
          rate, because the customer is in Maharashtra and the company is in
          Gujarat. Nobody told it that. It read both G S T numbers.
        tail_pad: 0.8

  - id: ch3-approval
    title: The approval gate
    beats:
      - id: b06-queue
        action: show_approvals
        say: >-
          Nothing has been posted. Every write stops in one queue, whichever way
          the request arrived, with the exact ledger effects to the paisa.

      - id: b07-approve
        action: approve_pending
        say: >-
          A person decides. That is the whole design: the agent does the typing,
          the firm keeps the judgement.
        tail_pad: 0.6

      - id: b08-daybook
        action: show_day_book
        say: >-
          And here is the same moment from Tally's side. This is Tally's own Day
          Book, not our rendering of it, and the voucher is in it, posted over
          X M L the instant that approval went through.
        tail_pad: 0.8

      - id: b09-back
        action: close_report
        say: Back to where we started.
        tail_pad: 0.4

  - id: ch4-bills
    title: The pile of bills
    beats:
      - id: b10-pile
        action: run_command
        args:
          command: /bills demo/bills --limit 4 --again
          # Not waited for here. Reading four scans is the better part of a
          # minute, and a beat that waits for it puts that minute on camera as
          # silence. The narration runs over the work; ch4 ends by waiting.
          wait: false
        say: >-
          One voucher at a time is not the job, though. This is: a folder of
          purchase bills, scanned, the way they arrive.
        tail_pad: 0.5

      - id: b11-reading
        action: pause
        say: >-
          Each scan is read on this machine, by local character recognition.
          Only the text it produced is sent to the model, never the image, and
          four of them are read at once. Vendor, invoice number, date, taxable
          value, tax - then matched to a supplier ledger that already exists in
          this company.
        tail_pad: 0.5

      - id: b12-queued
        action: pause
        say: >-
          Drafted, not posted. What it is sure of is queued as a purchase
          voucher; what it could not read, or could not match to a supplier the
          books already know, is set aside for a person rather than guessed
          at. A hundred and fifty bills is an afternoon; this is the same
          afternoon spent deciding rather than typing.
        tail_pad: 0.8

      - id: b12b-settled
        action: wait_for_agent
        say: Four bills, four drafts, none of them posted.
        max_overrun: 60
        tail_pad: 0.6

  - id: ch5-cursor
    title: Working inside Tally
    beats:
      - id: b13-tier3
        action: run_command
        args:
          command: /tier3 on
        say: >-
          There is a second way it can work, and for a lot of bookkeepers it is
          the one that matters.
        tail_pad: 0.4

      - id: b14-show
        action: say_to_agent
        args:
          text: show me the day book in Tally
        say: >-
          Asked to show something, it drives TallyPrime itself: opens the
          screen by name through Go To, then reads Tally's own header back to
          confirm the right screen is open.
        tail_pad: 0.6

      - id: b15-ring
        action: pause
        say: >-
          The ring is where it is working, and the caption says what it is
          about to press, before it presses it. If the screen is not the one it
          expected, it stops rather than typing into whatever has focus.
        tail_pad: 1.0

  - id: ch6-refusal
    title: What it refuses to do
    beats:
      - id: b16-bad-ask
        action: say_to_agent
        args:
          text: book 100 rent to the Baroda branch
        say: Now something that should not go through.
        tail_pad: 0.6

      - id: b17-refused
        action: show_refusal
        say: >-
          There is no Baroda cost centre in this company. There is a Vadodara,
          the same city under its other name, and the agent offers it rather
          than guessing. Validation runs before the queue, so this never became
          a ticket and nothing reached Tally.
        tail_pad: 0.8

  - id: ch7-close
    title: The month-end close
    beats:
      - id: b18-monthend
        action: run_command
        args:
          command: >-
            /monthend 2026-06 tests/fixtures/live_bank_statement.csv
            tests/fixtures/live_gstr2b.json
        say: >-
          And then the end of the month. The bank statement and the G-S-T-R
          two B go in together.
        max_overrun: 45
        tail_pad: 0.5

      - id: b19-findings
        action: pause
        say: >-
          One pack. Cash gone negative, ageing past ninety days, the same bill
          entered twice, statement lines with no voucher, and the input credit
          at risk because a supplier has not filed. In rupees, ranked by what
          somebody has to do about it.
        tail_pad: 0.8

      - id: b20-nothing-posted
        action: pause
        say: >-
          All of it read out of Tally, none of it changed, and written to a
          file as well - because what a practice needs on the first is
          something it can attach to an email.
        tail_pad: 0.8

  - id: ch8-audit
    title: Audit and close
    beats:
      - id: b21-audit
        action: run_command
        args:
          command: /egress
        say: >-
          Every tool call, approval and byte that left this machine is on a
          hash chained log. It verifies, so you can tell whether it has been
          altered.

      - id: b22-close
        action: closing_card
        say: >-
          The firm's people stay in the approval loop. The typing stops.
        tail_pad: 1.2
