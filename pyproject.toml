[project]
name = "tallyagent"
version = "0.1.0"
description = "Agentic bookkeeping system that operates TallyPrime via its XML-over-HTTP API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "lxml>=5.2",
    "sqlmodel>=0.0.22",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
desktop = ["pystray>=0.19", "pillow>=10.3", "mss>=9.0", "pywin32>=306; sys_platform == 'win32'"]
ocr = ["rapidocr-onnxruntime>=1.3"]
fallback = ["pyautogui>=0.9.54"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyinstaller>=6.8",
]

[project.scripts]
tallyagent = "tallyagent_daemon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/core/tallyagent_core",
    "packages/tally/tallyagent_tally",
    "packages/backends/tallyagent_backends",
    "packages/tools/tallyagent_tools",
    "packages/llm/tallyagent_llm",
    "packages/agent/tallyagent_agent",
    "packages/approvals/tallyagent_approvals",
    "packages/channels/tallyagent_channels",
    "packages/mcp_server/tallyagent_mcp_server",
    "packages/daemon/tallyagent_daemon",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["vendor", "deepseek-harness"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "tallyagent_core", "tallyagent_tally", "tallyagent_backends", "tallyagent_tools",
    "tallyagent_llm", "tallyagent_agent", "tallyagent_approvals",
    "tallyagent_channels", "tallyagent_mcp_server", "tallyagent_daemon",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/core/tallyagent_core"]

[tool.coverage.run]
source = [
    "packages/core", "packages/tally", "packages/tools", "packages/approvals",
]
