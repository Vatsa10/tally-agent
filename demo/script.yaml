# The demo script. This file is the source of truth for the video.
#
# The shape of it: every claim the agent makes in the terminal is then checked
# on Tally's own screen. The agent saying the stock is down by two is a claim;
# Tally's Stock Summary saying it is evidence, and it costs one keystroke. A
# demo that only ever shows its own UI is asking to be taken on trust.
#
# Copy is written the way the codebase talks: declarative, no adjectives doing
# sales work. Numbers are spelled the way a voice should read them, and
# abbreviations phonetically where a TTS engine would otherwise guess - "G-S-T-R
# two B", "X M L". The narration is checked against the rendered audio, so a
# mispronunciation fails the build rather than reaching the video.
title: tallyagent

voice:
  # Pinned here, not in code. `make_demo.py voices --locale en-IN` lists the
  # alternatives with their supported styles.
  voice_id: en-IN-eashwar
  style: Narration
  rate: -4

asr_model: nova-3
company: TA-Demo Traders

chapters:
  - id: ch1-problem
    title: The problem
    beats:
      - id: b01-title
        action: title_card
        say: >-
          TallyPrime runs the books at most Indian accounting firms. It has a
          full X M L interface, and almost nobody uses it. The work is done by
          hand, screen by screen, voucher by voucher.
        tail_pad: 0.8

      - id: b02-tally
        action: show_tally
        say: >-
          This is a real TallyPrime instance with a real company loaded.
          Everything after this point is live, and everything the agent claims
          gets checked against this window.

  - id: ch2-draft
    title: Chat drafts a voucher
    beats:
      - id: b03-tui
        action: open_tui
        say: >-
          The agent runs beside it. The status line states the scope it is
          allowed to write in: companies named T-A, and nothing else.

      - id: b04-ask
        action: say_to_agent
        args:
          # Named precisely. The agent refuses to guess a party or a tax rate,
          # which is what chapter four is about - asking it vaguely here would
          # only show the same refusal twice.
          text: >-
            raise a sales invoice to Acme Industries for 2 Widget at 3200 each,
            18% GST, sales ledger Sales - GST 18%, dated 2 June 2026,
            reference DEMO-{run}
        say: A sale, in plain words.
        tail_pad: 0.6

      - id: b05-draft
        action: show_draft
        say: >-
          The model does not write the voucher. It calls a typed tool, and the
          tool builds it. Two widgets at thirty two hundred. Taxable value six
          thousand four hundred. And the tax is integrated G S T, not the split
          rate, because the customer is in Maharashtra and the company is in
          Gujarat. Nobody told it that. It read both G S T numbers and worked
          it out.
        tail_pad: 0.8

  - id: ch3-approval
    title: The approval gate
    beats:
      - id: b06-queue
        action: show_approvals
        say: >-
          Nothing has been posted. Every write stops in one queue, whichever way
          the request arrived, with the exact ledger effects to the paisa.

      - id: b07-approve
        action: approve_pending
        say: >-
          A person decides. That is the whole design: the agent does the typing,
          the firm keeps the judgement.
        tail_pad: 0.6

  - id: ch4-landing
    title: Watching it land in Tally
    beats:
      - id: b08-daybook
        action: show_day_book
        say: >-
          And here is the same moment from Tally's side. This is Tally's own Day
          Book, not our rendering of it, and the voucher is in it - posted over
          X M L the instant that approval went through.
        tail_pad: 0.8

      - id: b09-stock
        action: show_stock_summary
        say: >-
          The sale moved goods as well as money, and this is Tally's own Stock
          Summary, valued as of today. Nobody typed any of it in.
        tail_pad: 0.8

      - id: b10-back
        action: close_report
        say: Back to where we started.
        tail_pad: 0.4

  - id: ch5-refusal
    title: What it refuses to do
    beats:
      - id: b11-bad-ask
        action: say_to_agent
        args:
          text: book 100 rent to the Baroda branch
        say: Now something that should not go through.
        tail_pad: 0.6

      - id: b12-refused
        action: show_refusal
        say: >-
          There is no Baroda cost centre in this company. There is a Vadodara,
          which is the same city under its other name, and the agent offers it
          rather than guessing. Validation runs before the approval queue, not
          after, so this never became a ticket and nothing reached Tally.
        tail_pad: 0.8

  - id: ch6-reports
    title: Reading the books back
    beats:
      - id: b13-tb
        action: say_to_agent
        args:
          text: trial balance please
        say: >-
          Reports come through the same tools, read live. The debits and the
          credits agree because they are Tally's own figures, not a copy kept
          somewhere else.

      - id: b14-outstanding
        action: say_to_agent
        args:
          text: who owes us money?
        say: >-
          Receivables, party by party, with the ageing.
        tail_pad: 0.8

  - id: ch7-reco
    title: Reconciliation
    beats:
      - id: b15-bank
        action: run_command
        args:
          command: /reco bank tests/fixtures/live_bank_statement.csv
        say: >-
          A bank statement goes in. The agent matches what it can against the
          ledger and proposes entries for the rest.

      - id: b16-gstr
        action: run_command
        args:
          command: /reco gstr2b tests/fixtures/live_gstr2b.json
        say: >-
          The same for G-S-T-R two B. Matched, value mismatches, and invoices
          missing from the books: listed, not quietly adjusted. Every proposal
          is still a ticket somebody has to approve.
        tail_pad: 0.8

  - id: ch8-tier3
    title: Driving Tally directly
    beats:
      - id: b17-cursor
        action: tier3_cursor
        say: >-
          Some things Tally will not do over X M L. For those there is a third
          tier that drives the keyboard directly, and you can watch it work. It
          is off by default, behind the same approval, and it narrates itself:
          the ring shows where it is going and the caption says what it is about
          to press, before it presses it.
        tail_pad: 1.0

  - id: ch9-audit
    title: Audit and close
    beats:
      - id: b18-audit
        action: run_command
        args:
          command: /egress
        say: >-
          Every tool call, every approval, and every byte that left this machine
          is on a hash chained log. It verifies, so you can tell whether it has
          been altered.

      - id: b19-close
        action: closing_card
        say: >-
          The firm's people stay in the approval loop. The typing stops.
        tail_pad: 1.2
