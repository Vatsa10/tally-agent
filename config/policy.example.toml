# Approval policy: action type -> approval mode.
# modes: "manual" (default, always queue) | "auto" | "auto_below_amount"
# Nothing is auto-approved out of the box. Use
#   tallyagent approvals stats
# to see per-action-type approve/reject rates before promoting anything.

[actions]
create_sales_voucher   = { mode = "manual" }
create_purchase_voucher = { mode = "manual" }
create_payment         = { mode = "manual" }
create_receipt         = { mode = "auto_below_amount", max_amount = 5000.00 }
create_journal         = { mode = "manual" }
create_ledger          = { mode = "manual" }
create_party           = { mode = "manual" }
alter_voucher          = { mode = "manual" }

[overrides]
# Allow a user to force-enqueue an action whose validation failed, with a
# logged reason. Off => validation failures are hard blocks.
allow_validation_override = true
